<VirtualHost *:80>
    ServerName museum.optegra.ru
    DocumentRoot /var/www/moscow-museums/current
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/moscow-museums>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/museum-optegra-error.log
    CustomLog ${APACHE_LOG_DIR}/museum-optegra-access.log combined
</VirtualHost>
